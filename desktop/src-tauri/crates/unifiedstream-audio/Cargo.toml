[package]
name = "unifiedstream-audio"
description = "UnifiedStream audio output: jitter buffering and the PipeWire virtual source. No Tauri dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Pin the 0.9.2 source revision: it wraps PipeWire's newer inline SPA helpers while avoiding
# the 0.10.0 SPA_ID_INVALID binding regression exposed by PipeWire 1.6 headers.
# The v0_3_49 feature unlocks Buffer::requested, which sizes each pull to the graph quantum.
pipewire = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs", rev = "03301bc734c9f1d3fb7a064c072458ad00245133", features = ["v0_3_49"] }

[dev-dependencies]
unifiedstream-net.workspace = true

[lints]
workspace = true
