[workspace]
members = [
    "crates/unifiedstream-net",
    "crates/unifiedstream-audio",
    "crates/unifiedstream-video",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
unifiedstream-net = { path = "crates/unifiedstream-net" }
unifiedstream-audio = { path = "crates/unifiedstream-audio" }
unifiedstream-video = { path = "crates/unifiedstream-video" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
mdns-sd = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
hostname = "0.4"

[workspace.lints.clippy]
# The transport parses untrusted network input; a panic there is a remote DoS.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

[package]
name = "desktop"
description = "UnifiedStream Linux desktop app"
authors = ["UnifiedStream contributors"]
homepage = "https://github.com/Mirai3103/UnifiedStream"
repository = "https://github.com/Mirai3103/UnifiedStream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
unifiedstream-net.workspace = true
unifiedstream-audio.workspace = true
unifiedstream-video.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
