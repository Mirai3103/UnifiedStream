name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openspec:
    name: openspec
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.6.0
      - name: Validate OpenSpec artifacts
        run: openspec validate --all

  rust:
    name: rust
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libspa-0.2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run production Clippy
        run: cargo clippy --workspace --lib --bins -- -D warnings
      - name: Run Rust workspace tests
        run: cargo test --workspace

  android:
    name: android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
            android/gradle/libs.versions.toml
      - name: Run Android debug unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Assemble Android debug APK
        run: ./gradlew assembleDebug --no-daemon

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
