name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openspec:
    name: openspec
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.6.0
      - name: Validate OpenSpec artifacts
        run: openspec validate --all
      - name: Validate release documentation
        run: python3 scripts/check-markdown.py

  rust:
    # One check per verified platform. The Windows leg is what keeps the application layer from
    # depending on a Linux-only type again: a new one fails to compile here, before review.
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libspa-0.2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.os }}
      - name: Check Rust formatting
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --all -- --check
      - name: Check the workspace compiles for this target
        if: matrix.os != 'ubuntu-24.04'
        run: cargo check --workspace
      - name: Run production Clippy
        run: cargo clippy --workspace --lib --bins -- -D warnings
      # Run on every leg. The suite is portable: the integration tests exercise the transport and
      # the portable pipeline, not the system, and each says so in its own header. Platform media
      # code is verified on the platform it targets rather than only compiled for it.
      #
      # The constraint that keeps this true: nothing added to this suite may require an audio or
      # video device, because the Windows runners have neither. Code that needs a real endpoint is
      # covered by a manual smoke run instead.
      - name: Run Rust workspace tests
        run: cargo test --workspace

  windows-native:
    # An area is defined by what builds it, not by what language it is written in. Nothing in the
    # other four areas invokes MSBuild, so without this job a change that breaks the DirectShow
    # filter merges green.
    #
    # It shares no cache, no toolchain, and no working directory with the `rust` job: that one runs
    # in `desktop/src-tauri` under Cargo with `Swatinem/rust-cache`, and this one runs at the
    # repository root under MSBuild with no cache at all. The one thing they have in common is the
    # runner image, and the conformance step below deliberately uses both — a Rust producer and a
    # C++ consumer in the same job is the whole point of it.
    name: windows-native
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the filter and the conformance tool for x64
        run: msbuild windows\UnifiedStreamWindows.sln -p:Configuration=Release -p:Platform=x64 -m
      - name: Build the filter and the conformance tool for Win32
        # Both architectures, because a 32-bit application can only load a 32-bit filter and the
        # desktop reports a half-registration as its own distinct unusable state.
        run: msbuild windows\UnifiedStreamWindows.sln -p:Configuration=Release -p:Platform=Win32 -m
      - name: Confirm both filters were produced under the names the desktop pins
        shell: pwsh
        run: |
          $expected = @(
            'windows\x64\Release\UnifiedStreamCamera64.dll',
            'windows\Win32\Release\UnifiedStreamCamera32.dll',
            'windows\x64\Release\ring_conform.exe',
            'windows\Win32\Release\ring_conform.exe'
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "missing build output: $path" }
          }
      - name: Confirm no decoder is linked into the filter
        # Decision 3 of docs/design.windows.md keeps JPEG on the desktop's side of the boundary so
        # the component loaded into other applications' processes never parses network-originated
        # bytes. A decoder cannot arrive without an import to carry it, so the import list is the
        # place that claim stays true. Checked rather than reviewed: a new #include is invisible.
        shell: pwsh
        run: |
          $allowed = @('kernel32.dll', 'advapi32.dll', 'user32.dll', 'gdi32.dll', 'ole32.dll',
                       'oleaut32.dll', 'winmm.dll')
          $dumpbin = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' |
                     Select-Object -First 1 -ExpandProperty FullName
          foreach ($dll in @('windows\x64\Release\UnifiedStreamCamera64.dll',
                             'windows\Win32\Release\UnifiedStreamCamera32.dll')) {
            $imports = & $dumpbin /dependents $dll |
                       Select-String -Pattern '^\s+(\S+\.dll)\s*$' |
                       ForEach-Object { $_.Matches[0].Groups[1].Value.ToLowerInvariant() }
            foreach ($import in $imports) {
              if ($allowed -notcontains $import) {
                throw "$dll imports $import, which is not on the allowlist. If this is deliberate, add it there — and if it is a media or image decoder, it does not belong in a component loaded into other applications' processes."
              }
            }
            Write-Host "$dll imports: $($imports -join ', ')"
          }
      - name: Check the COM surface applications actually use
        # A filter can deliver perfect frames into a graph built by hand and still be unopenable by
        # every real application. That is not hypothetical: the pin shipped without IAMStreamConfig,
        # which Chromium queries before anything else and gives up on, so the camera enumerated in
        # Discord and Chrome and opened in neither. Nothing else here noticed — the graph a test
        # harness builds with ConnectDirect never asks for it.
        #
        # This runs before the frame-level test on purpose: if the interfaces are wrong, whether the
        # pixels are right does not matter yet.
        shell: pwsh
        run: |
          $pairs = @(
            @('windows\x64\Release\filter_conform.exe',   'windows\x64\Release\UnifiedStreamCamera64.dll'),
            @('windows\Win32\Release\filter_conform.exe', 'windows\Win32\Release\UnifiedStreamCamera32.dll')
          )
          foreach ($pair in $pairs) {
            & $pair[0] $pair[1]
            if ($LASTEXITCODE -ne 0) { throw "$($pair[1]) does not present a usable capture surface" }
          }
      - name: Build the conformance publisher
        working-directory: desktop/src-tauri
        run: cargo build -p unifiedstream-video --example ring_smoke --release
      - name: Run the cross-toolchain conformance test
        # The only thing in either build that observes both halves of the transport at once. A wrong
        # memory ordering in the C++ consumer compiles cleanly, passes every static assertion it
        # has, and tears rarely enough to reach users; nothing but a real race against the real
        # producer catches it.
        #
        # Both architectures read the same 64-bit producer, which is also the check that the layout
        # is identical in a 32-bit and a 64-bit process rather than merely asserted to be.
        shell: pwsh
        run: |
          $readers = @(
            (Start-Process -FilePath 'windows\x64\Release\ring_conform.exe' `
                           -ArgumentList '--wait-ms','120000' -PassThru -NoNewWindow),
            (Start-Process -FilePath 'windows\Win32\Release\ring_conform.exe' `
                           -ArgumentList '--wait-ms','120000' -PassThru -NoNewWindow)
          )
          Push-Location desktop/src-tauri
          cargo run -p unifiedstream-video --example ring_smoke --release -- --publish-only
          $published = $LASTEXITCODE
          Pop-Location
          $failed = $published -ne 0
          foreach ($reader in $readers) {
            $reader.WaitForExit()
            if ($reader.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'the cross-toolchain conformance test failed' }

  android:
    name: android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
            android/gradle/libs.versions.toml
      - name: Run Android debug unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Assemble Android debug APK
        run: ./gradlew assembleDebug --no-daemon

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
