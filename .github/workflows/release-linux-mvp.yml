name: Linux MVP Prerelease

run-name: Linux MVP prerelease ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer prerelease tag, for example v0.1.0-mvp.1
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: linux-mvp-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: build-and-publish
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Require main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi

      - name: Check out exact release revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate version metadata
        id: version
        run: scripts/check-release-version.sh "$RELEASE_TAG"

      - name: Require successful quality jobs for this revision
        run: |
          quality_run_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=main&head_sha=$GITHUB_SHA&status=completed&per_page=20" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | .id' | head -n 1)"
          if [[ -z "$quality_run_id" ]]; then
            echo "No successful Quality workflow found for $GITHUB_SHA" >&2
            exit 1
          fi

          completed_jobs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$quality_run_id/jobs?per_page=100" \
            --jq '.jobs[] | [.name, .conclusion] | @tsv')"
          for required_job in openspec rust android frontend; do
            if ! grep -Fqx "$required_job"$'\t'"success" <<< "$completed_jobs"; then
              echo "Required job $required_job did not pass for $GITHUB_SHA" >&2
              exit 1
            fi
          done

      - name: Refuse an existing tag or release
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libspa-0.2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
            android/gradle/libs.versions.toml

      - name: Build and verify release artifacts
        run: scripts/build-release-artifacts.sh "$RELEASE_TAG" release-dist

      - name: Render release notes
        run: |
          sed \
            -e "s/{{TAG}}/$RELEASE_TAG/g" \
            -e "s/{{VERSION}}/${RELEASE_TAG#v}/g" \
            .github/release-notes.md > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub prerelease
        run: |
          gh release create "$RELEASE_TAG" \
            release-dist/UnifiedStream-* \
            release-dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "UnifiedStream ${RELEASE_TAG#v} — Linux MVP" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
